<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EasyLog</title>
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body>
    <main id="loginView" class="login-shell hidden">
      <section class="login-panel">
        <div class="brand-mark">EL</div>
        <h1>EasyLog</h1>
        <form id="loginForm" class="stack">
          <label>
            Email
            <input name="email" type="email" autocomplete="email" required value="admin@easylog.local" />
          </label>
          <label>
            Password
            <input name="password" type="password" autocomplete="current-password" required value="admin1234" />
          </label>
          <button class="primary" type="submit">登录</button>
        </form>
        <p id="loginError" class="error-line"></p>
      </section>
    </main>

    <main id="appView" class="app-shell hidden">
      <aside class="sidebar">
        <div class="sidebar-head">
          <div class="brand-mark small">EL</div>
          <div>
            <strong>EasyLog</strong>
            <span id="activeUser"></span>
          </div>
        </div>
        <div class="sidebar-actions">
          <button id="newProjectBtn" type="button">新建项目</button>
          <button id="usersBtn" type="button">用户</button>
        </div>
        <nav id="projectList" class="project-list"></nav>
        <button id="logoutBtn" class="ghost bottom-action" type="button">退出登录</button>
      </aside>

      <section class="workspace">
        <header class="topbar">
          <div>
            <h1 id="projectTitle">Logs</h1>
            <p id="projectMeta"></p>
          </div>
          <div class="topbar-actions">
            <button id="tokenBtn" type="button">接入 Token</button>
          </div>
        </header>

        <section class="stats-row">
          <div class="stat">
            <span>24h logs</span>
            <strong id="statTotal">0</strong>
          </div>
          <div class="stat">
            <span>24h errors</span>
            <strong id="statErrors">0</strong>
          </div>
          <div class="stat">
            <span>24h sessions</span>
            <strong id="statSessions">0</strong>
          </div>
        </section>

        <section class="filters">
          <label>
            From
            <input id="fromInput" type="datetime-local" />
          </label>
          <label>
            To
            <input id="toInput" type="datetime-local" />
          </label>
          <label>
            Level
            <select id="levelInput">
              <option value="">All</option>
              <option value="trace">Trace</option>
              <option value="debug">Debug</option>
              <option value="info">Info</option>
              <option value="warn">Warn</option>
              <option value="error">Error</option>
              <option value="exception">Exception</option>
              <option value="fatal">Fatal</option>
            </select>
          </label>
          <label class="wide">
            Search
            <input id="qInput" type="search" placeholder="message, stack, custom fields" />
          </label>
          <label>
            Player
            <input id="playerInput" type="search" />
          </label>
          <label>
            Session
            <input id="sessionInput" type="search" />
          </label>
          <label>
            Version
            <input id="versionInput" type="search" />
          </label>
          <label>
            Platform
            <input id="platformInput" type="search" />
          </label>
          <div class="filter-actions">
            <button id="exportCsvBtn" type="button">导出 CSV</button>
            <button id="exportJsonBtn" type="button">导出 JSON</button>
          </div>
        </section>

        <section class="log-table-wrap">
          <table class="log-table">
            <thead>
              <tr>
                <th>Time</th>
                <th>Level</th>
                <th>Message</th>
                <th>Player</th>
                <th>Session</th>
                <th>Version</th>
                <th>Platform</th>
                <th>Scene</th>
              </tr>
            </thead>
            <tbody id="logRows"></tbody>
          </table>
          <div id="emptyState" class="empty-state hidden">No logs found.</div>
        </section>

        <footer class="pager">
          <button id="prevPageBtn" type="button">上一页</button>
          <span id="pageInfo">0 results</span>
          <button id="nextPageBtn" type="button">下一页</button>
        </footer>
      </section>
    </main>

    <aside id="detailDrawer" class="drawer hidden">
      <header>
        <div>
          <h2>Log detail</h2>
          <p id="detailMeta"></p>
        </div>
        <button id="closeDrawerBtn" class="icon-button" title="关闭" type="button">x</button>
      </header>
      <section id="detailBody" class="detail-body"></section>
    </aside>

    <div id="modalBackdrop" class="modal-backdrop hidden">
      <section class="modal">
        <header>
          <h2 id="modalTitle"></h2>
          <button id="closeModalBtn" class="icon-button" title="关闭" type="button">x</button>
        </header>
        <div id="modalBody"></div>
      </section>
    </div>

    <div id="toast" class="toast hidden"></div>
    <script src="/app.js"></script>
  </body>
</html>
